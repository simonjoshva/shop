<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow">
<div class="card-header bg-dark text-white text-center">
<h3>
➕ Add Product
</h3>
</div>
<div class="card-body">
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<!-- Category -->
<label class="form-label">
Category
</label>
<select name="category" class="form-select mb-3">
{% for category in categories %}
<option value="{{category.id}}">{{category.name}}</option>
{% endfor %}
</select>
<!-- Product Name -->
<label class="form-label">Product Name</label>
<input type="text"
name="name"class="form-control mb-3"placeholder="Enter product name"required>
<label class="form-label">
Description
</label>
<textarea name="description"
class="form-control mb-3"rows="4"placeholder="Enter product description"></textarea>
<label class="form-label">
Price
</label>
<div class="input-group mb-3">
<span class="input-group-text">₹</span>
<input type="number" step="0.01" name="price" class="form-control" placeholder="Enter price">
</div>
<label class="form-label">Stock Quantity</label>
<input type="number" name="stock" class="form-control mb-3" placeholder="Enter stock">
<label class="form-label">
Product Image
</label>
<input type="file" name="image" class="form-control mb-4">
<button type="submit" class="btn btn-success w-100">
💾 Save Product
</button>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
