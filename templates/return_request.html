<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
<h2 class="text-center">
🔄 Request Return
</h2>
<div class="card shadow p-4">
<h4>
Order ID: #{{order.id}}
</h4>
<form method="POST">
{% csrf_token %}
<label class="form-label">
Return Reason
</label>
<textarea name="reason" class="form-control" rows="5" placeholder="Explain why you want to return this product" required>
</textarea>
<br>
<button type="submit" class="btn btn-warning"> Submit Return Request</button>
</form>
</div>
</div>
{% endblock %}
</body>
</html>
