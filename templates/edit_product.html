<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow">
<div class="card-header bg-warning text-center">
<h3>
✏️ Edit Product
</h3>
</div>
<div class="card-body">
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<label class="form-label">
Product Name
</label>
<input type="text" name="name" value="{{product.name}}" class="form-control mb-3">
<label class="form-label">
Category
</label>
<select name="category"class="form-select mb-3">
{% for category in categories %}
<option value="{{category.id}}" {% if category.id == product.category.id %} selected{% endif %}>
{{category.name}}
</option>
{% endfor %}
</select>
<label class="form-label">
Description
</label>
<textarea name="description"class="form-control mb-3"rows="4">
{{product.description}}
</textarea>
<label class="form-label">
Price
</label>
<div class="input-group mb-3">
<span class="input-group-text">₹</span>
<input type="number"name="price"value="{{product.price}}"class="form-control">
</div>
<label class="form-label">
Stock
</label>
<input type="number"
name="stock"
value="{{product.stock}}"
class="form-control mb-3">
<label class="form-label">
Current Image
</label>
<br>
{% if product.image %}
<img src="{{product.image.url}}"width="200"height="200"class="rounded mb-3"style="object-fit:cover;">
{% endif %}
<label class="form-label">
Change Image
</label>
<input type="file"
name="image"
class="form-control mb-4">
<button type="submit"
class="btn btn-success w-100">
💾 Update Product
</button>
</form>
<a href="{% url 'product_list' %}"class="btn btn-secondary w-100 mt-3">⬅ Back to Products</a>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
