<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2>Complete Payment</h2>
    <h3>Amount to Pay:₹{{ final_amount }}</h3>
    <button id="pay-btn">Pay Now</button> 
    <script src="http://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options={
            "key":"rzp_test_TPzICPAGA3EzNQ",
            "amount":"{{ payment.amount }}",
            "currency":"INR",
            "order_id":"{{ payment.id }}",
            "handler":function(response){
                window.location.href="/payment-success/?razorpay_payment_id="
                + response.razorpay_payment_id
                + "&razorpay_order_id="
                + response.razorpay_order_id
                + "&razorpay_signature="
                + response.razorpay_signature;
            }

        };
        var rzp=new Razorpay(options);
        document.getElementById("pay-btn").onclick=function(e){rzp.open();
            e.preventDefault();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
