<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
</head>
<body>
    <h1>
        Update profile
    </h1>
    <form method="POST">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" value="{{ request.user.name }}">
        <br>
        <label>Email</label>
        <input type="email" name="email" value="{{ request.user.email }}">
        <br>
        <label>Phone</label>
        <input type="text" name="phone" value="{{ profile.phone }}">
        <br>
        <label>Address</label>
        <textarea name="address">
            {{ profile.address }}
        </textarea>
        <br>
        <br>
        <button type="submit">Save Changesss</button>
    </form>
    
</body>
</html>
