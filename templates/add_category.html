<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
Add Category
</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow">
<div class="card-header bg-dark text-white text-center">
<h3>
➕ Add Category
</h3>
</div>
<div class="card-body">
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<label class="form-label">
Category Name
</label>
<input type="text" name="name" class="form-control mb-3" placeholder="Enter category name" required>
<label class="form-label">
Description
</label>
<textarea name="description" class="form-control mb-3" rows="4" placeholder="Enter category description">
</textarea>
<label class="form-label">
Category Image
</label>
<input type="file" name="image" class="form-control mb-4">
<button type="submit" class="btn btn-success w-100">
💾 Save Category
</button>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
